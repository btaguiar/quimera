[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quimera"
version = "0.1.0"
description = "Agente que transforma pedidos em português em listas ranqueadas de empresas (CNPJ), combinando LLM, embeddings e BigQuery."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    # Busca CNAE multi-vetor: ~18,5 mil vetores (Python puro ficaria lento).
    "numpy>=1.26",
]

[project.optional-dependencies]
# Dependências de GCP nunca são importadas no topo dos módulos:
# todo import é lazy (dentro de funções), então `pytest` roda sem este extra.
gcp = [
    "google-cloud-bigquery>=3",
    "google-genai>=1",
]
api = [
    "fastapi>=0.115,<0.150",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
    "fastapi>=0.115,<0.150",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quimera = ["data/*.jsonl", "data/*.npz"]
"quimera.api" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
